plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

def stagedPythonRoot = layout.buildDirectory.dir("pythonSrc")
def stagedPythonPackage = stagedPythonRoot.map { it.dir("src") }

// Keeps the APK Python code isolated in the build directory. Sync also
// removes stale files a Copy task would leave behind from earlier builds.
tasks.register('copyPythonSources', Sync) {
    from rootProject.file("../../src")
    into stagedPythonPackage
    // Bytecode built for the desktop interpreter has the wrong magic number on
    // the device, and packaging metadata is dead weight inside the APK.
    exclude '**/__pycache__/**', '**/*.pyc', '**/*.egg-info/**'
}

// Chaquopy can package an invalid .py and only reveal the error on the device.
// Compile every prepared source before letting the APK be assembled.
tasks.register('validatePythonSources', Exec) {
    dependsOn 'copyPythonSources'
    commandLine 'python3.14', '-m', 'compileall', '-q', stagedPythonPackage.get().asFile
}

// Makes the Chaquopy tasks depend on the preparation and validation steps.
project.afterEvaluate {
    tasks.configureEach { task ->
        if (!(task.name in ['copyPythonSources', 'validatePythonSources']) &&
                (task.name.contains("Python") || task.name.contains("python"))) {
            task.dependsOn 'validatePythonSources'
        }
    }
}

android {
    namespace = 'com.al4xdev.alextavern'
    compileSdk = 36

    defaultConfig {
        applicationId = "com.al4xdev.alextavern"
        minSdk = 24
        targetSdk = 36
        versionCode = 1
        versionName = "0.1"

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"

        ndk {
            // Python 3.14 and current Play devices are 64-bit only.
            abiFilters += ["arm64-v8a", "x86_64"]
        }
    }

    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

chaquopy {
    defaultConfig {
        version = "3.14"
        extractPackages("src")

        // Every wheel here must be pure Python: the canonical dependency set
        // deliberately avoids Android-native build forks. pydantic 2 pulls
        // pydantic-core (Rust), and Uvicorn's optional extras pull native extensions.
        pip {
            install("pydantic<2")
            install("fastapi>=0.115,<0.116")
            install("uvicorn")
            install("httpx")
        }
    }

    sourceSets {
        getByName("main") {
            // The staged canonical package and the Android entry point are the
            // only Python roots packaged into the APK.
            srcDirs = ["${stagedPythonRoot.get().asFile}", "src/main/python"]
        }
    }
}

dependencies {
    // 1.19 requires the API 37 preview SDK; 1.18 is the newest stable-36 line.
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
}
